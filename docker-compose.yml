# Déploiement prod du Frontend sur jobtrack-server.
# Image poussée sur ECR par .gitlab-ci.yml (VITE_API_URL/VITE_MESSAGING_API_URL
# déjà bakées dans le build, voir .env.example — rien à lire depuis un .env ici
# à part le port hôte).

services:
  frontend:
    image: ${ECR_REGISTRY}/jobtrack-frontend:${IMAGE_TAG:-latest}
    ports:
      - '${FRONTEND_PORT:-80}:80'
    networks:
      - jobtrack-network
    restart: unless-stopped

networks:
  jobtrack-network:
    external: true
